name: trivia-mundial-documentacion

services:
  latex:
    image: texlive/texlive:TL2025-historic
    working_dir: /workspace/docs/informe
    volumes:
      - .:/workspace
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -eu
        mkdir -p /workspace/build/latex /workspace/entregables
        latexmk -pdf -interaction=nonstopmode -halt-on-error -file-line-error \
          -outdir=/workspace/build/latex main.tex
        cp /workspace/build/latex/main.pdf \
          /workspace/entregables/Informe_Trivia_Mundial.pdf

  word:
    image: trivia-mundial-word:3.10.0.0
    build:
      context: .
      dockerfile: docs/informe/Dockerfile.word
    working_dir: /workspace/docs/informe
    volumes:
      - .:/workspace
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -eu
        mkdir -p /workspace/build/word /workspace/entregables
        pandoc main.tex --from=latex --to=docx --citeproc \
          --bibliography=referencias.bib --resource-path=.:../.. \
          --reference-doc=referencia-apa7.docx \
          --output=/workspace/build/word/informe-base.docx
        python3 /workspace/scripts/finalizar_word.py \
          --entrada=/workspace/build/word/informe-base.docx \
          --salida=/workspace/entregables/Informe_Trivia_Mundial.docx

  docs:
    image: docker:29.1.3-cli
    command: version
    profiles: ["helper"]
